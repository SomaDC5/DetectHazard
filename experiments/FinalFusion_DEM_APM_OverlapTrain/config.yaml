# 実験条件の定義。フォルダを増やせば条件が増える。
# 重みは dc5-data/weights/<name>/ にあり、ここには置かない。
name: FinalFusion_DEM_APM_OverlapTrain
arch: MultiEncoderUNet
family: Final
inputs:
- key: terrain
  source: DEM
  channels: 1
  field: DEM
- key: airphoto
  source: APM
  channels: 3
  field: AirPhoto
augment: false
bg_ratio: 0.0
status: active
# 学習した手順の世代。詳しくは docs/設計図_修正案.md の 6
protocol: v2-config
# 和集合（アンサンブル）に入れてよいか
ensemble: true
# torch.manual_seed を呼んで学習したか
seeded: false
label: Final DEM+APM オーバーラップ学習
note: オーバーラップ学習の DEM+APM 版。アンサンブルに混ぜるため、入力を変えた対を作る。相関が最も低いのは入力の違い（DEM系 対 SAM系 で 0.596〜0.615）なので、同じ切り方で入力だけ変えた2本は混ぜたときに効くはず。SAM+APM
  版は箇所R 0.6192→0.7036。docs/展望_再現率をどう上げるか.md 8.6
dataset:
  Hiroshima: hiroshima_dem_apm_normalized.pkl
  Shimane: shimane_dem_apm_normalized.pkl
train:
  epochs: 1000
  batch_size: 32
  lr: 0.0001
  seed: 42
  early_stop_patience: 100
  split: 6:2:2 (train_test_split test_size=0.2 -> 0.25, random_state=42)
  model_selection: 検証データのF値が最良のエポック
  loss:
    type: focal_tversky
    alpha: 0.7
    beta: 0.3
    gamma: 0.75
  augment_params: null
