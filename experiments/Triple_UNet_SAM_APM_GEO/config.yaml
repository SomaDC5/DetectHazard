# 実験条件の定義。フォルダを増やせば条件が増える。
# 重みは dc5-data/weights/<name>/ にあり、ここには置かない。
# inputs を増やせば3入力以上にできる（モデル側の実装も必要）。
name: Triple_UNet_SAM_APM_GEO
arch: TripleEncoderUNet
family: Triple
inputs:
- key: terrain
  source: SAM
  channels: 1
  field: DEM
  note: 傾斜角マップ(度)
- key: airphoto
  source: APM
  channels: 3
  field: AirPhoto
  note: 航空写真 RGB
- key: geology
  source: GEO
  channels: 3
  field: Geo
  note: 地質図。pkl内の属性名は要確認
augment: false
bg_ratio: 0.0
status: excluded
label: ''
note: 指示書で解析対象外。地質図を加えた3入力。モデル定義は dc5lib/models.py に未登録
dataset:
  Hiroshima: hirosima_sam_apm_geo_final_v2.pkl
  Shimane: shimane_sam_apm_geo_final_v2.pkl
train:
  epochs: 1000
  batch_size: 32
  lr: 0.0001
  seed: 42
  split: 6:2:2 (train_test_split test_size=0.2 -> 0.25, random_state=42)
  model_selection: 検証データのF値が最良のエポック
  loss:
    type: focal_tversky
    alpha: 0.7
    beta: 0.3
    gamma: 0.75
  augment_params: null
