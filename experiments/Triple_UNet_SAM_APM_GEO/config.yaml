# 実験条件の定義。フォルダを増やせば条件が増える。
# 重みは dc5-data/weights/<name>/ にあり、ここには置かない。
name: Triple_UNet_SAM_APM_GEO
arch: TripleEncoderUNet
family: Triple
terrain: SAM
use_airphoto: true
augment: false
bg_ratio: 0.0
status: excluded
label: ''
note: 指示書で解析対象外。地質図を加えた3入力。モデル定義は dc5lib/models.py に未登録
dataset:
  Hiroshima: hirosima_sam_apm_geo_final_v2.pkl
  Shimane: shimane_sam_apm_geo_final_v2.pkl
train:
  epochs: 1000
  batch_size: 32
  lr: 0.0001
  seed: 42
  split: 6:2:2 (train_test_split test_size=0.2 -> 0.25, random_state=42)
  model_selection: 検証データのF値が最良のエポック
  loss:
    type: focal_tversky
    alpha: 0.7
    beta: 0.3
    gamma: 0.75
  augment_params: null
