# 実験条件の定義。フォルダを増やせば条件が増える。
# 重みは dc5-data/weights/<name>/ にあり、ここには置かない。
name: MIddleFusion_DEM_APM
arch: MiddleFusionUNet
family: Middle
terrain: DEM
use_airphoto: true
augment: false
bg_ratio: 0.0
status: active
label: ''
note: フォルダ名の I が大文字なのは既存の綴り。過去ログとの突き合わせのため変更しない
dataset:
  Hiroshima: hiroshima_dem_apm_normalized.pkl
  Shimane: shimane_dem_apm_normalized.pkl
train:
  epochs: 1000
  batch_size: 32
  lr: 0.0001
  seed: 42
  split: 6:2:2 (train_test_split test_size=0.2 -> 0.25, random_state=42)
  model_selection: 検証データのF値が最良のエポック
  loss:
    type: focal_tversky
    alpha: 0.7
    beta: 0.3
    gamma: 0.75
  augment_params: null
