# 実験条件の定義。フォルダを増やせば条件が増える。
# 重みは dc5-data/weights/<name>/ にあり、ここには置かない。
name: FinalFusion_SAM_APM_bg10_ASPPStride8
arch: ASPPStride8MultiEncoderUNet
family: Final
inputs:
- key: terrain
  source: SAM
  channels: 1
  field: DEM
- key: airphoto
  source: APM
  channels: 3
  field: AirPhoto
augment: false
bg_ratio: 0.1
status: active
label: ''
note: ASPP に加えてボトルネックを 16x16 に上げた版（出力ストライド16→8）。ASPP単体は補助ヘッドが+0.119改善したのに本体が変わらず、デコーダはスキップではなくボトルネック経路を使っていると分かったため、そちらの解像度を上げる。次の手_文脈と不均衡.md
  の案A+案B
dataset:
  Hiroshima: hiroshima_sam_apm.pkl
  Shimane: shimane_sam_apm.pkl
train:
  epochs: 1000
  batch_size: 32
  lr: 0.0001
  seed: 42
  early_stop_patience: 100
  split: 6:2:2 (train_test_split test_size=0.2 -> 0.25, random_state=42)
  model_selection: 検証データのF値が最良のエポック
  loss:
    type: focal_tversky
    alpha: 0.7
    beta: 0.3
    gamma: 0.75
    aux_lambda: 0.5
    aux_stages:
    - 2
  augment_params: null
