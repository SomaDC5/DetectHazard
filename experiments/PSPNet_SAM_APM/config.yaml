# 実験条件の定義。フォルダを増やせば条件が増える。
# 重みは dc5-data/weights/<name>/ にあり、ここには置かない。
name: PSPNet_SAM_APM
arch: PSPNetDual
family: PSPNet
inputs:
- key: terrain
  source: SAM
  channels: 1
  field: DEM
  note: 傾斜角マップ(度)
- key: airphoto
  source: APM
  channels: 3
  field: AirPhoto
  note: 航空写真 RGB
augment: false
bg_ratio: 0.0
status: active
# 学習した手順の世代。詳しくは docs/設計図_修正案.md の 6
protocol: v2-config
# 和集合（アンサンブル）に入れてよいか
ensemble: true
# torch.manual_seed を呼んで学習したか
seeded: true
label: PSPNet SAM+APM
note: 'アーキテクチャの族の比較（FCN / DeepLabv3 / SegFormer と並べる）。符号化器は MultiEncoderUNet と同一にしてあり、違いは頭だけ。ストライド8（16x16）でピラミッドプーリング（区画
  1/2/3/6）をかけ、3x3 で混ぜてから x8 に拡大する。16x16 では 1 画素が 35.8 m 四方で、かたまりの典型サイズ（約81m四方）は 2.3
  画素しかない。SegFormer が 1/4 解像度のぼやけで負けたのと同じことが起きるかを見る。補助損失（aux head）は切ってある。入れると損失が他条件と変わり、族の違いと損失の違いが混ざるため。'
dataset:
  Hiroshima: hiroshima_sam_apm.pkl
  Shimane: shimane_sam_apm.pkl
train:
  epochs: 1000
  batch_size: 32
  lr: 0.0001
  seed: 42
  split: 6:2:2 (train_test_split test_size=0.2 -> 0.25, random_state=42)
  model_selection: 検証データのF値が最良のエポック
  loss:
    type: focal_tversky
    alpha: 0.7
    beta: 0.3
    gamma: 0.75
  augment_params: null
  early_stop_patience: 100
