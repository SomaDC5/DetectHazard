# 実験条件の定義。フォルダを増やせば条件が増える。
# 重みは dc5-data/weights/<name>/ にあり、ここには置かない。
name: FinalFusion_SAM_APM_BLD_rerun_OverlapTrain
arch: TripleEncoderUNet
family: Final
inputs:
- key: terrain
  source: SAM
  channels: 1
  field: DEM
- key: airphoto
  source: APM
  channels: 3
  field: AirPhoto
- key: building
  source: BLD
  channels: 2
  field: Building
augment: false
bg_ratio: 0.0
status: active
label: Final SAM+APM+建物(実のみ) オーバーラップ学習 2本目
note: 44.7 の対照。FinalFusion_SAM_APM_BLD_OverlapTrain と設定は完全に同じで、学習をもう1回やり直すだけ。ノートブックは
  torch の乱数を固定していないので(manual_seed が無い)、同じ config でも重みの初期値とシャッフル順は毎回変わる。seed は背景タイルの抽選にしか効かず
  bg_ratio=0 では無効なので、seed を変えるのではなく条件名を分けて2本目の重みを残す。目的は BLD と BVB の床の重なり(Jaccard 0.482/0.570)が仮想建物のおかげか、ただ学習が別だからかの切り分け。入力を変えずに本数を増やしたときの床の下がりの下限が分かり、J2(27
  の4族を足す)の見込みを事前に見積もれる。docs/展望_再現率をどう上げるか.md 44.7
dataset:
  Hiroshima: hiroshima_sam_apm_bld.pkl
  Shimane: shimane_sam_apm_bld.pkl
train:
  epochs: 1000
  batch_size: 32
  lr: 0.0001
  seed: 42
  early_stop_patience: 100
  split: 6:2:2 (train_test_split test_size=0.2 -> 0.25, random_state=42)
  model_selection: 検証データのF値が最良のエポック
  loss:
    type: focal_tversky
    alpha: 0.7
    beta: 0.3
    gamma: 0.75
  augment_params: null
