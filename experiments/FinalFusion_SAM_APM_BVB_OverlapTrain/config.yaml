# 実験条件の定義。フォルダを増やせば条件が増える。
# 重みは dc5-data/weights/<name>/ にあり、ここには置かない。
name: FinalFusion_SAM_APM_BVB_OverlapTrain
arch: TripleEncoderUNet
family: Final
inputs:
- key: terrain
  source: SAM
  channels: 1
  field: DEM
- key: airphoto
  source: APM
  channels: 3
  field: AirPhoto
- key: building
  source: BVB
  channels: 3
  field: BuildingVB
augment: false
bg_ratio: 0.0
status: active
label: Final SAM+APM+建物(実+仮想) オーバーラップ学習
note: 実建物(基盤地図情報BldA)に仮想建物を足した3面を3入力目にしたオーバーラップ学習。42 で UNION3 の誰も光らせない正解が広島8.0%/島根18.4%あり、これが再現率の天井を決めると分かった。床を下げる構成員を作るのが狙い。指定基準は保全対象(人家5戸以上)の有無を含むので、建物は3本に無い情報である。仮想建物は家はあるが5戸に届かない麓だけに置く(一律に置くと正解/背景の比が広島0.340・島根0.254と逆向きになる)。docs/展望_再現率をどう上げるか.md
  43
dataset:
  Hiroshima: hiroshima_sam_apm_bldvb.pkl
  Shimane: shimane_sam_apm_bldvb.pkl
train:
  epochs: 1000
  batch_size: 32
  lr: 0.0001
  seed: 42
  early_stop_patience: 100
  split: 6:2:2 (train_test_split test_size=0.2 -> 0.25, random_state=42)
  model_selection: 検証データのF値が最良のエポック
  loss:
    type: focal_tversky
    alpha: 0.7
    beta: 0.3
    gamma: 0.75
  augment_params: null
