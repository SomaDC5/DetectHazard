# 実験条件の定義。フォルダを増やせば条件が増える。
# 重みは dc5-data/weights/<name>/ にあり、ここには置かない。
name: MLPDecoder_SAM_APM
arch: MLPDecoderDual
family: MLPDecoder
inputs:
- key: terrain
  source: SAM
  channels: 1
  field: DEM
  note: 傾斜角マップ(度)
- key: airphoto
  source: APM
  channels: 3
  field: AirPhoto
  note: 航空写真 RGB
augment: false
bg_ratio: 0.0
status: planned
label: 全MLPデコーダ SAM+APM
note: 'SegFormer_SAM_APM から符号化器だけを入れ替えた条件。展望_再現率をどう上げるか.md の 27 で「SegFormer の欠損 0.169
  は解像度では説明できない。残るのは符号化器」と消去法で結論したが、それは実証ではない。この1本がその検証にあたる。箇所F が 0.48 付近なら原因は全MLPデコーダ（消去法の結論が誤り）、0.63
  付近なら原因は Mix Transformer 符号化器（結論が正しい）。デコーダは SegFormerDual と同一で、出力解像度も 1/4（32x32）に揃えてある。符号化器は
  MultiEncoderUNet と同じ2本のVGG風（64/128/256/512）。学習の設定・損失・分割・seed は既存条件と完全に同一。'
dataset:
  Hiroshima: hiroshima_sam_apm.pkl
  Shimane: shimane_sam_apm.pkl
train:
  epochs: 1000
  batch_size: 32
  lr: 0.0001
  seed: 42
  split: 6:2:2 (train_test_split test_size=0.2 -> 0.25, random_state=42)
  model_selection: 検証データのF値が最良のエポック
  loss:
    type: focal_tversky
    alpha: 0.7
    beta: 0.3
    gamma: 0.75
  augment_params: null
  early_stop_patience: 100
