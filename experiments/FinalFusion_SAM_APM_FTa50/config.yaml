# 実験条件の定義。フォルダを増やせば条件が増える。
# 重みは dc5-data/weights/<name>/ にあり、ここには置かない。
name: FinalFusion_SAM_APM_FTa50
arch: MultiEncoderUNet
family: Final
inputs:
- key: terrain
  source: SAM
  channels: 1
  field: DEM
- key: airphoto
  source: APM
  channels: 3
  field: AirPhoto
augment: false
bg_ratio: 0.0
status: active
# 学習した手順の世代。詳しくは docs/設計図_修正案.md の 6
protocol: v2-config
# 和集合（アンサンブル）に入れてよいか
ensemble: true
# torch.manual_seed を呼んで学習したか
seeded: false
label: Final SAM+APM 損失 a0.5/b0.5
note: "損失を適合率側に振った版（FocalTversky alpha=0.5/beta=0.5 = 見逃しと過検出を等価に）。手順0の片側。結果は 展望_再現率をどう上げるか.md 11節 — 適合率は買えず（島根では箇所P −0.0328）、WNet の2段目候補にはならなかった。"
dataset:
  Hiroshima: hiroshima_sam_apm.pkl
  Shimane: shimane_sam_apm.pkl
train:
  epochs: 1000
  batch_size: 32
  lr: 0.0001
  seed: 42
  split: 6:2:2 (train_test_split test_size=0.2 -> 0.25, random_state=42)
  model_selection: 検証データのF値が最良のエポック
  loss:
    type: focal_tversky
    alpha: 0.5
    beta: 0.5
    gamma: 0.75
  augment_params: null
  early_stop_patience: 100
