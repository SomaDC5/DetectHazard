# 実験条件の定義。フォルダを増やせば条件が増える。
# 重みは dc5-data/weights/<name>/ にあり、ここには置かない。
name: Train_Hiroshima_Test_Shimane_OnlyDEM
arch: UNet
family: Single
terrain: DEM
use_airphoto: false
augment: false
bg_ratio: 0.0
status: active
label: ''
note: 100エポック・検証分割なし。他条件と学習条件が揃っていない
dataset:
  Hiroshima: hiroshima_dem_normalized.pkl
  Shimane: shimane_dem_normalized.pkl
train:
  epochs: 100
  batch_size: 32
  lr: 0.0001
  seed: 42
  split: 8:2 (train_test_split test_size=0.2, random_state=42) 検証分割なし
  model_selection: テストデータのF値が最良のエポック（デュアル入力条件と条件が揃っていない）
  loss:
    type: focal_tversky
    alpha: 0.7
    beta: 0.3
    gamma: 0.75
  augment_params: null
