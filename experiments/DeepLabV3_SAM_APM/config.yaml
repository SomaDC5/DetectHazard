# 実験条件の定義。フォルダを増やせば条件が増える。
# 重みは dc5-data/weights/<name>/ にあり、ここには置かない。
name: DeepLabV3_SAM_APM
arch: DeepLabV3Dual
family: DeepLab
inputs:
- key: terrain
  source: SAM
  channels: 1
  field: DEM
  note: 傾斜角マップ(度)
- key: airphoto
  source: APM
  channels: 3
  field: AirPhoto
  note: 航空写真 RGB
augment: false
bg_ratio: 0.0
status: active
# 学習した手順の世代。詳しくは docs/設計図_修正案.md の 6
protocol: v2-config
# 和集合（アンサンブル）に入れてよいか
ensemble: true
# torch.manual_seed を呼んで学習したか
seeded: true
label: DeepLabv3 SAM+APM
note: 'アーキテクチャの族の比較（FCN / PSPNet / SegFormer と並べる）。符号化器は MultiEncoderUNet と同一にしてあり、違いは頭だけ。ストライド8（16x16）で
  ASPP をかけて x8 に拡大する。拡張率は特徴マップの大きさに合わせて (2,4,6) に縮めてある。元論文は 513x513・ストライド16（33x33）で
  (6,12,18) なので、同じ比率なら (3,6,9)。16x16 からはみ出す枝は全タップが余白に当たって無意味になるため、収まる (2,4,6) にした。既存の
  ASPPStride8MultiEncoderUNet は U-Net のスキップに ASPP を足したものであり、これとは別物（こちらはデコーダを持たない）。'
dataset:
  Hiroshima: hiroshima_sam_apm.pkl
  Shimane: shimane_sam_apm.pkl
train:
  epochs: 1000
  batch_size: 32
  lr: 0.0001
  seed: 42
  split: 6:2:2 (train_test_split test_size=0.2 -> 0.25, random_state=42)
  model_selection: 検証データのF値が最良のエポック
  loss:
    type: focal_tversky
    alpha: 0.7
    beta: 0.3
    gamma: 0.75
  augment_params: null
  early_stop_patience: 100
