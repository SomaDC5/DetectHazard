# 実験条件の定義。フォルダを増やせば条件が増える。
# 重みは dc5-data/weights/<name>/ にあり、ここには置かない。
name: FinalFusion_SAM_APM_BLD_OverlapTrain
arch: TripleEncoderUNet
family: Final
inputs:
- key: terrain
  source: SAM
  channels: 1
  field: DEM
- key: airphoto
  source: APM
  channels: 3
  field: AirPhoto
- key: building
  source: BLD
  channels: 2
  field: Building
augment: false
bg_ratio: 0.0
status: active
# 学習した手順の世代。詳しくは docs/設計図_修正案.md の 6
protocol: v2-config
# 和集合（アンサンブル）に入れてよいか
ensemble: true
# torch.manual_seed を呼んで学習したか
seeded: false
# オーバーラップ学習。ノートブックに直書きしていた値を、2026-10-29 に
# 実装を読んで写した（max_shift=64 / seed=42。挙動は変わらない）
overlap:
  max_shift: 64
  seed: 42
label: Final SAM+APM+建物(実のみ) オーバーラップ学習
note: K3 の対照。実建物2面(建物・無壁舎)だけを3入力目にしたオーバーラップ学習。仮想建物は入れない。43 で BVB が床を 8.0%->6.2% /
  18.4%->13.7% に下げたが、効いたのが建物の情報なのか仮想建物なのか切り分けられていない。BVB との差が仮想建物の取り分である。他の設定は BVB
  と完全に同じにする。docs/展望_再現率をどう上げるか.md 43.13 / 44
dataset:
  Hiroshima: hiroshima_sam_apm_bld.pkl
  Shimane: shimane_sam_apm_bld.pkl
train:
  epochs: 1000
  batch_size: 32
  lr: 0.0001
  seed: 42
  early_stop_patience: 100
  split: 6:2:2 (train_test_split test_size=0.2 -> 0.25, random_state=42)
  model_selection: 検証データのF値が最良のエポック
  loss:
    type: focal_tversky
    alpha: 0.7
    beta: 0.3
    gamma: 0.75
  augment_params: null
