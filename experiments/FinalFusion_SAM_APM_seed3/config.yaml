# 実験条件の定義。フォルダを増やせば条件が増える。
# 重みは dc5-data/weights/<name>/ にあり、ここには置かない。
name: FinalFusion_SAM_APM_seed3
arch: MultiEncoderUNet
family: Final
inputs:
- key: terrain
  source: SAM
  channels: 1
  field: DEM
- key: airphoto
  source: APM
  channels: 3
  field: AirPhoto
augment: false
bg_ratio: 0.0
status: active
# 学習した手順の世代。詳しくは docs/設計図_修正案.md の 6
protocol: v2-config
# 和集合（アンサンブル）に入れてよいか
ensemble: true
# torch.manual_seed を呼んで学習したか
seeded: true
label: Final SAM+APM シード3
note: 複数シードのゆらぎ幅を測るための条件。出発点 FinalFusion_SAM_APM と同じ構成でシードだけ変える。展望.md 1節のゆらぎ幅（検証F1の上位10エポックで0.003-0.005）は同一学習内のばらつきで、学習をやり直したときのばらつきは未測定だった。修士論文の構成.md
  4.7
dataset:
  Hiroshima: hiroshima_sam_apm.pkl
  Shimane: shimane_sam_apm.pkl
train:
  epochs: 1000
  batch_size: 32
  lr: 0.0001
  seed: 3
  split: 6:2:2 (train_test_split test_size=0.2 -> 0.25, random_state=42)
  model_selection: 検証データのF値が最良のエポック
  loss:
    type: focal_tversky
    alpha: 0.7
    beta: 0.3
    gamma: 0.75
  augment_params: null
  early_stop_patience: 100
