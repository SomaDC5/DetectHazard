# 実験条件の定義。フォルダを増やせば条件が増える。
# 重みは dc5-data/weights/<name>/ にあり、ここには置かない。
name: FinalFusion_SAM_APM_FTa85
arch: MultiEncoderUNet
family: Final
inputs:
- key: terrain
  source: SAM
  channels: 1
  field: DEM
- key: airphoto
  source: APM
  channels: 3
  field: AirPhoto
augment: false
bg_ratio: 0.0
status: active
label: Final SAM+APM 損失 a0.85/b0.15
note: "損失を再現率側に振った版（FocalTversky alpha=0.85/beta=0.15）。手順0の片側。結果は 展望_再現率をどう上げるか.md 11節 — 面積R は +0.0307 動くが箇所R は +0.0078 だけで、WNet の1段目候補にはならなかった。"
dataset:
  Hiroshima: hiroshima_sam_apm.pkl
  Shimane: shimane_sam_apm.pkl
train:
  epochs: 1000
  batch_size: 32
  lr: 0.0001
  seed: 42
  split: 6:2:2 (train_test_split test_size=0.2 -> 0.25, random_state=42)
  model_selection: 検証データのF値が最良のエポック
  loss:
    type: focal_tversky
    alpha: 0.85
    beta: 0.15
    gamma: 0.75
  augment_params: null
  early_stop_patience: 100
