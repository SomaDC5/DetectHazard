# 評価に使う地域の定義。地域を増やすときはここに1つ足す。
# key         コード中で使う識別子（小文字・英数字）
# dir         dc5-data/datasets/ 以下のフォルダ名
# label       図表に出す日本語
# role        train  … 学習に使う（ホールドアウトを切る）
#             eval   … 評価専用（全タイルを使う）
# subset      all      … その地域の全タイル
#             holdout  … 警戒区域を含むタイルの2割（学習時と同じ分割）
#             background … 警戒区域を含まないタイル
#             gtonly     … 警戒区域を含むタイルだけ（土俵を揃える用）
#             blocktest  … 空間ブロック分割のテスト側（splits/*.csv で定義）
regions:
  hiroshima:
    dir: Hiroshima
    label: 広島
    role: train
    subset: holdout
    note: 学習に使った県。テストは警戒区域を含むタイルのホールドアウト2,964枚

  hiroshima_bg:
    dir: Hiroshima
    label: 広島（背景タイル）
    role: train
    subset: background
    note: 警戒区域を1画素も含まないタイル23,332枚。学習には未使用

  hiroshima_block:
    dir: Hiroshima
    label: 広島（ブロック分割）
    role: train
    subset: blocktest
    note: 空間ブロック分割のテスト側3,673枚。splits/hiroshima_block_20km.csv で定義。
      学習タイルからの距離で層別して評価する（第6章 6.2）

  shimane_gt:
    dir: Shimane
    label: 島根（正解ありタイルのみ）
    role: eval
    subset: gtonly
    note: '警戒区域を含む9,679枚だけ。広島は正解ありタイルしか評価していないので、
      適合率を比べるときはこちらで揃える（第6章）。コロンを含む語はYAMLが
      マッピングと誤読するので、この note は引用符で囲んである'

  shimane:
    dir: Shimane
    label: 島根
    role: eval
    subset: all
    note: 学習に一切使っていない県。全24,569枚

